<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#060d09;color:#d1fae5;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;width:100%}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;padding:32px 24px;text-align:center;background:radial-gradient(ellipse at 60% 20%,#0f2d18 0%,#060d09 100%)}
.logo-circle{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#16a34a);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:24px;box-shadow:0 0 60px #4ade8055}
h1{font-size:28px;color:#f0fdf4;margin-bottom:4px}
.brand{font-size:11px;color:#4ade80;letter-spacing:0.15em;font-family:'Courier New',monospace;margin-bottom:4px}
.sub{font-size:10px;color:#4b5563;letter-spacing:0.1em;margin-bottom:24px}
.welcome-desc{font-size:13px;line-height:1.6;color:#6b7280;max-width:300px;margin-bottom:32px}
.start-btn{padding:14px 40px;border-radius:50px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e0f;border:none;cursor:pointer;letter-spacing:0.06em;box-shadow:0 4px 30px #4ade8044}
.start-note{margin-top:16px;font-size:11px;color:#374151}

/* Chat */
#chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #0f2d18;background:#060d09;flex-shrink:0}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#16a34a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#052e0f;position:relative;flex-shrink:0}
.online-dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#4ade80;border:2px solid #060d09}
.header-name{font-size:14px;font-weight:700;color:#f0fdf4}
.header-status{font-size:10px;color:#4ade80;font-family:'Courier New',monospace;letter-spacing:0.06em}
.progress-wrap{display:flex;align-items:center;gap:6px;margin-left:auto}
.progress-bar{width:72px;height:6px;border-radius:3px;background:#0f2d18;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4ade80,#16a34a);transition:width 0.3s}
.progress-pct{font-size:11px;color:#4ade80}
.new-btn{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid #1e3a28;color:#4ade80;background:transparent;cursor:pointer}

#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble-row{display:flex;align-items:flex-end;gap:8px}
.bubble-row.user{justify-content:flex-end}
.mini-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#16a34a);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#052e0f;flex-shrink:0;margin-bottom:2px}
.bubble{font-size:13px;padding:12px 16px;max-width:84%;box-shadow:0 1px 4px #00000044;line-height:1.5}
.bubble.bot{background:#132418;border:1px solid #1e3a28;border-radius:18px 18px 18px 4px;color:#d1fae5}
.bubble.user{background:linear-gradient(135deg,#16a34a,#15803d);border-radius:18px 18px 4px 18px;color:#f0fdf4}
.bubble p{margin-bottom:4px}.bubble p:last-child{margin-bottom:0}
.bubble strong{color:#86efac}
.typing{display:flex;align-items:center;gap:6px;padding:12px 16px;background:#132418;border:1px solid #1e3a28;border-radius:18px 18px 18px 4px;width:fit-content}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.typing-label{font-size:11px;color:#4b5563}

/* Kit buttons */
.kit-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kit-btn{font-size:11px;padding:6px 12px;border-radius:20px;border:1px solid #4ade80;color:#4ade80;background:transparent;cursor:pointer;transition:all 0.2s}
.kit-btn.active{background:#4ade8022}

/* Kit card */
.kit-card{margin-left:36px;margin-top:8px;border-radius:16px;overflow:hidden;border:1px solid #1e3a28;background:#0b1a0f}

.kit-name{font-size:13px;font-weight:700;color:#4ade80}
.kit-strips-count{font-size:11px;color:#6b7280;margin-top:2px}
.close-btn{font-size:11px;padding:3px 8px;border-radius:8px;background:#1a3320;color:#6b7280;border:none;cursor:pointer}

/* Kit box image */
.kit-box-img{width:100%;max-height:180px;object-fit:contain;background:#000;padding:8px}
.kit-section{padding:12px 16px;border-top:1px solid #1e3a28}
.kit-section-title{font-size:10px;font-weight:700;color:#4ade80;letter-spacing:0.05em;margin-bottom:8px}

/* Topical images */
.topical-name{font-size:12px;color:#86efac;margin-bottom:8px}
.topical-imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.topical-imgs img{height:100px;width:auto;max-width:180px;border-radius:10px;border:1px solid #1e3a28;object-fit:cover;flex-shrink:0}


/* Contact form */
.contact-card{margin-left:36px;margin-top:8px;border-radius:16px;overflow:hidden;border:1px solid #4ade8055;background:#0b1a0f}
.contact-header{padding:12px 16px;background:#16a34a15;border-bottom:1px solid #1e3a28}
.contact-title{font-size:13px;font-weight:700;color:#4ade80}
.contact-sub{font-size:11px;color:#6b7280;margin-top:2px}
.contact-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.form-label{font-size:11px;font-weight:600;color:#86efac;display:block;margin-bottom:4px}
.form-input{width:100%;font-size:13px;padding:10px 12px;border-radius:10px;border:1px solid #1e3a28;background:#0f2d18;color:#d1fae5;outline:none;font-family:Georgia,serif}
.checkbox-row{display:flex;align-items:flex-start;gap:8px}
.checkbox-btn{width:20px;height:20px;border-radius:4px;border:1px solid #1e3a28;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all 0.2s}
.checkbox-btn.checked{background:#4ade80;border-color:#4ade80}
.checkbox-label{font-size:11px;color:#6b7280}
.form-error{font-size:11px;color:#f87171}
.submit-btn{width:100%;padding:12px;border-radius:10px;font-size:13px;font-weight:600;background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e0f;border:none;cursor:pointer}
.form-note{text-align:center;font-size:11px;color:#374151}

/* Input area */

.choice-grid{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}

// fetched on demand and cacheable by the browser.
//
// Each key has two responsive variants — <key>-400.webp and <key>-800.webp
// (source art is 800px wide, so there is no upscaled 1200 variant). IMGS maps
// each key to its URL base; DIMS carries the intrinsic 800w dimensions so the
// <img> can reserve space and avoid layout shift.
const IMG_BASE = "assets/img/";
const IMGS = {
  alopecia: IMG_BASE + "alopecia",
  emugrow: IMG_BASE + "emugrow",
  faga_gold: IMG_BASE + "faga_gold",

  alopecia: [800, 600],

  hbr: [800, 650],
  healthy9: [800, 640],

// Build a responsive <img> for a kit/product image key. Returns "" for an
// unknown key (same as the old IMGS[key] truthiness guard). Every image here is
// rendered only when a kit card is opened, so all default to lazy loading.
function imgTag(key, { className = "", alt = "", sizes = "" } = {}) {
  const base = IMGS[key];
  if (!base) return "";
  const d = DIMS[key] || [800, 600];
  const cls = className ? ` class="${className}"` : "";
  const sz = sizes ? ` sizes="${sizes}"` : "";
  return `<img${cls} src="${base}-800.webp" srcset="${base}-400.webp 400w, ${base}-800.webp 800w"${sz} width="${d[0]}" height="${d[1]}" alt="${alt}" loading="lazy" decoding="async">`;
}

// ── Funnel logic ───────────────────────────────────────────────────────────────
function getFunnelKits(ans) {
  const isFemale = (ans.sex||"").includes("Female");
  const isMale = (ans.sex||"").includes("Male");
  const age = parseInt(ans.age)||0, above30 = age>=30;
  const dur=ans.duration||"", count=ans.count||"";
  const ht=ans.hairtype||[], cause=ans.cause||[], scalp=ans.scalp||[];
  const imm=ans.immunity||[], life=ans.lifestyle||[], horm=ans.hormonal||[];
  const gut=ans.gut||[], def=ans.deficiency||[], diet=ans.diet||[], treat=ans.treatment||[];
  const isVeg=diet.some(d=>["Vegetarian","Vegan","Jain"].some(k=>d.includes(k)));
  const score={};
  const add=(kit,pts)=>{score[kit]=(score[kit]||0)+pts;};

  if(dur.includes("1–3")||dur.includes("3–6")) add(isMale?"HAIR FACT TE GOLD":"HAIR FACT TE GOLD VEG",3);
  if(dur.includes("6–12")) { above30?add(isMale?"M-AGA GOLD":"F-AGA GOLD",3):add(isMale?"M-AGA":"F-AGA",3); }
  if(dur.includes("1 year")){add("PRO IMMUNE GOLD",3);add(isMale?"NEW - M2":"NEW - F2",2);}
  if(count.includes("20–50")) add("PRO IMMUNE GOLD",2);
  if(count.includes("50–100")) add(isMale?"HAIR FACT TE GOLD":"HAIR FACT TE GOLD VEG",2);
  if(count.includes("100")) add("PRO IMMUNE GOLD",2);
  if(ht.some(h=>h.includes("Full-length"))) add(isMale?"HAIR FACT TE GOLD":"HAIR FACT TE GOLD VEG",3);
  if(ht.some(h=>h.includes("Broken"))) add("HAIR FACT HAIR BREAKAGE REPAIR(HBR)",4);
  if(ht.some(h=>h.includes("Bald patches"))) add("HAIR FACT ALOPECIA AREATA",4);
  if(ht.some(h=>h.includes("thinning"))) { above30?add(isMale?"M-AGA GOLD":"F-AGA GOLD",2):add(isMale?"M-AGA":"F-AGA",2); }
  if(cause.some(c=>["Stress","Anxiety","Depression","Hair pulling"].some(k=>c.includes(k)))) add(isMale?"NEW - M3":"NEW - F3",3);
  if(cause.some(c=>c.includes("Hard water"))) add("HAIR FACT HAIR BREAKAGE REPAIR(HBR)",3);
  if(cause.some(c=>c.includes("Post pregnancy"))) add(isVeg?"POST M - V1":"POST - M",4);
  if(cause.some(c=>c.includes("Hair pulling"))) add("HAIR FACT TTM (OCD)",4);
  if(cause.some(c=>["Genetics","Nutritional","Medication","illness","Surgery"].some(k=>c.toLowerCase().includes(k.toLowerCase())))) add("PRO IMMUNE GOLD",2);
  if(scalp.some(s=>["Dandruff","Oily"].some(k=>s.includes(k)))) { above30?add(isMale?"M-AGA GOLD":"F-AGA GOLD",2):add(isMale?"M-AGA":"F-AGA",2); }
  if(scalp.some(s=>["Redness","Boils","Burning"].some(k=>s.includes(k)))) add(isMale?"NEW - M2":"NEW - F2",3);
  if(imm.some(i=>["cough","cold","Asthma","allerg","rash"].some(k=>i.toLowerCase().includes(k.toLowerCase())))) add("PRO IMMUNE GOLD",3);
  if(imm.some(i=>i.includes("Alopecia Areata"))) add("HAIR FACT ALOPECIA AREATA",5);
  if(life.some(l=>["Smoking","Vaping","Alcohol"].some(k=>l.includes(k)))) add(isMale?"NEW - M2":"NEW - F2",3);
  if(life.some(l=>l.includes("Bodybuilding"))) add(isMale?"M-AGA GOLD":"F-AGA GOLD",2);
  if(life.some(l=>["Obesity","weight loss","Sedentary"].some(k=>l.toLowerCase().includes(k.toLowerCase())))) add("HEALTHY - 9",3);
  if(life.some(l=>["Sleep","night shift","Night shift"].some(k=>l.toLowerCase().includes(k.toLowerCase())))) add("HAIR FACT NIGHT SHIFT",4);
  if(life.some(l=>l.includes("Frequent flying"))) add("HAIR FACT FREQUENT FLYERS",4);
  if(horm.some(h=>h.includes("Thyroid"))) add("THYROID CARE - I",5);
  if(horm.some(h=>h.includes("PCOS"))) add(isVeg?"F-PCOS VEG -1":"F-PCOS -1",5);
  if(horm.some(h=>h.includes("Endometriosis"))) add("NEW - F2",3);
  if(horm.some(h=>h.includes("Peri"))) add(isVeg?"HAIR FACT PERI MENOPAUSE VEG":"HAIR FACT PERI MENOPAUSE",5);
  if(horm.some(h=>h.includes("Menopausal")&&!h.includes("Peri"))) add("PRO IMMUNE GOLD",3);
  if(horm.some(h=>h.includes("delivery")||h.includes("Post delivery"))) add(isVeg?"POST M - V1":"POST - M",4);
  if(horm.some(h=>h.includes("HRT"))) add("PRO IMMUNE GOLD",2);
  if(gut.some(g=>["Bloating","Acidity","GERD"].some(k=>g.includes(k)))) add("PRO IMMUNE GOLD",2);
  if(gut.some(g=>["IBS","Leaky","Constipation"].some(k=>g.includes(k)))) add("PRO IMMUNE GOLD",3);
  if(def.some(d=>d.includes("Iron"))) add(isMale?"M-ZERO IRON":"F-ZERO IRON",5);
  if(def.some(d=>d.includes("B12"))) add("ZERO- B12",5);
  if(treat.some(t=>["Heat","Colour","Straight","Chemical"].some(k=>t.includes(k)))) add("HAIR FACT HAIR BREAKAGE REPAIR(HBR)",2);

  return Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]).filter(k=>KITS[k]);
}

const ANTHROPIC_API_KEY = "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 E";

async function callClaude(system, userMsg) {
  // CORS proxy required for GitHub Pages / browser deployments
  const url = "https://corsproxy.io/?url=" + encodeURIComponent("https://api.anthropic.com/v1/messages");
  let r;
  try {
    r = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1100,
        system: system,
        messages: [{ role: "user", content: userMsg }]
      })
    });
  } catch(e) {
    throw new Error("Network error — check internet connection: " + e.message);
  }
  if(!r.ok) {
    const errText = await r.text();
    if(r.status === 401) throw new Error("Invalid API key. Please check your key at console.anthropic.com");
    if(r.status === 429) throw new Error("Rate limit reached. Please wait a moment and try again.");
    throw new Error("API error " + r.status + ": " + errText.slice(0,120));
  }
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.content?.[0]?.text||"";
}

// ── Render helpers ────────────────────────────────────────────────────────────
function md(text) {
  return text.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}

function addMsg(role, content, extra={}) {
  state.msgs.push({role, content, extra, id: Date.now()+Math.random()});
  render();
  setTimeout(()=>{ const el=document.getElementById("bottom"); if(el) el.scrollIntoView({behavior:"smooth"}); },80);
}

function renderKitCard(kitName) {
  const strips = KITS[kitName]||[];
  const ki = KIT_IMAGES[kitName];

  const kitBoxImg = ki ? imgTag(ki.kit, { className: "kit-box-img", alt: kitName, sizes: "(max-width: 480px) 92vw, 440px" }) : '';
  const topicalHtml = ki ? `
    <div class="kit-section">
      <div class="kit-section-title">💊 RECOMMENDED TOPICAL TREATMENT</div>
      <div class="topical-name">${ki.topicalName}</div>
      <div class="topical-imgs">${ki.topicals.map(t=>imgTag(t, { alt: t, sizes: "180px" })).join('')}</div>
    </div>` : '';

  return `<div class="kit-card" id="kitcard-${kitName.replace(/[^a-z0-9]/gi,'_')}">
    <div class="kit-card-header">
      <div>
        <div class="kit-name">📦 ${kitName}</div>
        <div class="kit-strips-count">${strips.length} strips · Cyclical Nutrition Protocol</div>
      </div>
      <button class="close-btn" onclick="closeKit()">✕</button>
    </div>
    ${kitBoxImg}
    ${topicalHtml}
  </div>`;
}

    <div class="contact-header">
      <div class="contact-title">📋 Send My Report</div>
      <div class="contact-sub">Receive your personalised Dr. FACT consultation on WhatsApp / Email</div>
    </div>
    <div class="contact-body">
      <div>
        <label class="form-label">📱 WhatsApp / Phone Number</label>
        <input class="form-input" id="cf-phone" type="tel" placeholder="+91 9XXXXXXXXX">
      </div>
      <div>
        <label class="form-label">📧 Email Address</label>

}

let cfConsent = false;
function toggleConsent() {
  cfConsent = !cfConsent;
  const btn = document.getElementById("cf-consent-btn");
  if(btn){ btn.classList.toggle("checked", cfConsent); btn.textContent = cfConsent ? "✓" : ""; }
}
function submitContact() {
  const phone = document.getElementById("cf-phone")?.value||"";
  const email = document.getElementById("cf-email")?.value||"";
  const errEl = document.getElementById("cf-error");
  if(!phone&&!email){ if(errEl) errEl.textContent="Please provide a phone number or email."; return; }
  if(!cfConsent){ if(errEl) errEl.textContent="Please confirm your consent."; return; }
  state.showContact = false;
  state.contactDone = true;
  addMsg("user", `📱 ${phone||"—"}  |  📧 ${email||"—"}`);
  setTimeout(()=>addMsg("assistant",
    `✅ **Report queued for delivery, ${state.answers.name||"there"}!**\n\n`+
    `${phone?`📱 WhatsApp: ${phone}\n`:""}`+
    `${email?`📧 Email: ${email}\n`:""}`+
    `\nYour personalised trichologist report including kit prescription, strip schedule, and topical recommendations will be sent shortly.\n\nFeel free to ask me anything in the meantime. 🌿`
  ),400);
}

function closeKit(){ state.openKit=null; render(); }
function toggleKit(name){ state.openKit = state.openKit===name?null:name; render(); setTimeout(()=>{const el=document.getElementById("kitcard-"+name.replace(/[^a-z0-9]/gi,'_'));if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});},80); }

function render() {
  const app = document.getElementById("app");
  if(!app) return;

  if(state.phase==="welcome") {
    app.innerHTML = `<div class="welcome">
      <div class="logo-circle">🌿</div>
      <h1>Dr. FACT</h1>
      <p class="brand">THE FACT NUTRITION</p>
      <p class="sub">AI TRICHOLOGIST CONSULTATION</p>
      <p class="welcome-desc">Our products — Hair, Skin, and Pro Fact — are designed to elevate your cellular environment and correct nutritional imbalances, improving your hair and skin while optimising your cellular function.</p>
      <button class="start-btn" onclick="startQuiz()">BEGIN MY CONSULTATION →</button>
      <p class="start-note">~3 minutes · 17 questions · Free personalised report</p>
    </div>`;
    return;
  }

  const progress = Math.round((state.stepIdx/STEPS.length)*100);
  const step = STEPS[state.stepIdx];

  // Build messages HTML
  let msgsHtml = "";
  state.msgs.forEach((m,mi)=>{
    const isUser = m.role==="user";
    const bubbleContent = m.content.split("\n").map(l=>`<p>${md(l)||"&nbsp;"}</p>`).join("");

    if(isUser){
      msgsHtml += `<div class="bubble-row user"><div class="bubble user">${bubbleContent}</div></div>`;
    } else {
      let extra = "";
      if(m.extra?.type==="report" && m.extra.kits?.length) {
        const btns = m.extra.kits.map(k=>`<button class="kit-btn${state.openKit===k?" active":""}" onclick="toggleKit('${k.replace(/'/g,"\\'")}')">📦 ${k}</button>`).join("");
        extra = `<div class="kit-btns">${btns}</div>`;
        if(state.openKit && m.extra.kits.includes(state.openKit)){
          extra += renderKitCard(state.openKit);
        }
      }
      msgsHtml += `<div class="bubble-row"><div class="mini-avatar">DF</div><div style="flex:1;min-width:0"><div class="bubble bot">${bubbleContent}${extra}</div>${state.showContact&&mi===state.msgs.length-1?renderContactForm():""}</div></div>`;
    }
  });

  // Typing indicator
  if(state.thinking){
    msgsHtml += `<div class="bubble-row"><div class="mini-avatar">DF</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span class="typing-label">${state.phase==="thinking"?"Preparing your consultation...":"Dr. FACT is typing..."}</span></div></div>`;
  }

  // Build input HTML
  let inputHtml = "";
  if(state.phase==="quiz" && !state.thinking && step) {
    if(step.type==="choice"){
      inputHtml = `<div class="choice-grid">${step.opts.map(o=>`<button class="choice-btn" onclick="submitAnswer('${o.replace(/'/g,"\\'")}')">  ${o}</button>`).join("")}</div>`;
    } else if(step.type==="multi"){
      const selSet=new Set(state.multiSel);
      inputHtml = `<div class="multi-grid">${step.opts.map(o=>`<button class="multi-btn${selSet.has(o)?" sel":""}" onclick="toggleMulti('${o.replace(/'/g,"\\'")}')">  ${selSet.has(o)?"✓ ":""}${o}</button>`).join("")}</div>
      <button class="confirm-btn" onclick="confirmMulti()">Confirm (${state.multiSel.length} selected) →</button>`;
    } else {
      inputHtml = `<div class="text-row"><input class="text-input" id="text-inp" type="${step.type==="number"?"number":"text"}" placeholder="${step.type==="textarea"?"Type here or press Enter to skip...":"Type your answer..."}" onkeydown="if(event.key==='Enter')submitText()"><button class="send-btn" onclick="submitText()">→</button></div>`;
    }
  } else if(state.phase==="done" && !state.thinking && !state.showContact){
    inputHtml = `<div class="text-row"><input class="text-input" id="free-inp" placeholder="Ask Dr. FACT anything, ${state.answers.name||""}…" onkeydown="if(event.key==='Enter')sendFree()"><button class="send-btn" onclick="sendFree()">→</button></div>
    <p class="free-hint">Tap <strong style="color:#4ade80">📦 kit name</strong> above to view kit box, topical & schedule</p>`;
  }

  app.innerHTML = `
    <div id="chat-header">
      <div class="avatar">DF<div class="online-dot"></div></div>
      <div>
        <div class="header-name">Dr. FACT</div>
        <div class="header-status">${state.phase==="quiz"?`Q ${state.stepIdx+1} / ${STEPS.length}`:state.phase==="thinking"?"ANALYSING...":"THE FACT NUTRITION"}</div>
      </div>
      ${state.phase==="quiz"?`<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div><span class="progress-pct">${progress}%</span></div>`:""}
      ${state.phase==="done"?`<button class="new-btn" onclick="resetApp()">New</button>`:""}
    </div>
    <div id="messages">${msgsHtml}<div id="bottom"></div></div>
    ${inputHtml?`<div id="input-area">${inputHtml}</div>`:""}
  `;

  // Auto-focus text input
  const ti = document.getElementById("text-inp")||document.getElementById("free-inp");
  if(ti) setTimeout(()=>ti.focus(),80);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function startQuiz(){
  state.phase="quiz"; state.stepIdx=0;
  addMsg("assistant",STEPS[0].label);
}

function toggleMulti(opt){
  const i=state.multiSel.indexOf(opt);
  if(i>=0) state.multiSel.splice(i,1); else state.multiSel.push(opt);
  render();
}

function confirmMulti(){
  const val = state.multiSel.length ? [...state.multiSel] : ["None"];
  submitAnswer(val);
}

function submitText(){
  const el=document.getElementById("text-inp");
  const val=el?el.value.trim():"";
  const step=STEPS[state.stepIdx];
  submitAnswer(val||(step.id==="extra"?"(skipped)":""));
}

function submitAnswer(val){
  const step=STEPS[state.stepIdx];
  const display=Array.isArray(val)?val.join(", "):val;
  if(!display) return;
  addMsg("user",display);
  const newAns={...state.answers,[step.id]:val};
  state.answers=newAns; state.multiSel=[];
  const next=state.stepIdx+1;
  if(next<STEPS.length){
    const nextStep=STEPS[next];
    // Skip hormonal for males
    if(nextStep.id==="hormonal"&&(newAns.sex||"").includes("Male")){
      state.answers.hormonal=["N/A — Male"];
      state.stepIdx=next+1;
      setTimeout(()=>addMsg("assistant",STEPS[next+1]?.label||""),350);
      return;
    }
    state.stepIdx=next;
    setTimeout(()=>addMsg("assistant",nextStep.label),350);
  } else {
    state.phase="thinking";
    addMsg("assistant",`Thank you, **${newAns.name}**! 🌿 Analysing your complete hair profile... just a moment.`);
    state.thinking=true; render();
    setTimeout(()=>runAnalysis(newAns),700);
  }
}

async function runAnalysis(ans){
  const recommended=getFunnelKits(ans);
  state.kits=recommended;
  const kitContext=recommended.map(k=>{
    const strips=KITS[k]||[];
    const topical=KIT_IMAGES[k]?.topicalName||"";
    return `KIT: ${k}\nTopical Pair: ${topical}\nStrips:\n${strips.map(s=>`  • ${s.name} — ${s.schedule}`).join("\n")}`;
  }).join("\n\n");

  const profile=STEPS.filter(s=>ans[s.id]!==undefined).map(s=>{
    const v=Array.isArray(ans[s.id])?ans[s.id].join(", "):ans[s.id];
    return `${s.label.replace(/\?.*$/,"").trim()}: ${v}`;
  }).join("\n");

  const system=`You are Dr. FACT — senior hair trichologist at The Fact Nutrition with 20+ years experience. Root cause is ROS/free radicals NOT DHT. Gut-Hair Axis, HPA axis, cyclical nutrition protocol — these are your scientific pillars. Kits prescribed:\n${kitContext}\nPatient:\n${profile}\n\nWrite a warm, expert 520-word personalised consultation report with sections: Clinical Assessment, Root Cause Analysis, Your Prescription, Lifestyle Recommendations, Expected Timeline. Use **bold** for headings and kit names.`;

  try {
    const report=await callClaude(system,"Give me my personalised trichologist consultation report.");
    state.thinking=false;
    addMsg("assistant",report,{type:"report",kits:recommended});
    state.chatHistory=[{role:"user",content:"Report"},{role:"assistant",content:report}];
    state.phase="done";
    setTimeout(()=>{
      addMsg("assistant","📋 Would you like me to **send this report** to you on WhatsApp or Email? Share your contact details below:");
      state.showContact=true; render();
    },1200);
  } catch(e){
    state.thinking=false;
    addMsg("assistant",`Sorry, there was an error: ${e.message}. Please check your API key and try again.`);
    state.phase="done";
  }
}

async function sendFree(){
  const el=document.getElementById("free-inp");
  const msg=el?el.value.trim():"";
  if(!msg||state.thinking) return;
  el.value="";
  addMsg("user",msg);
  state.thinking=true; render();
  const sys=`You are Dr. FACT at The Fact Nutrition. Patient ${state.answers.name||""} (Age ${state.answers.age||""}, ${state.answers.sex||""}) was prescribed: ${state.kits.join(", ")}. Answer warmly and specifically. Under 200 words.`;
  try {
    const reply=await callClaude(sys,msg);
    state.thinking=false;
    addMsg("assistant",reply);
  } catch(e){ state.thinking=false; addMsg("assistant","Sorry, I ran into an error. Please try again."); }
}

function resetApp(){
  state={phase:"welcome",stepIdx:0,answers:{},multiSel:[],msgs:[],kits:[],openKit:null,showContact:false,contactDone:false,chatHistory:[]};
  cfConsent=false;
  render();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", ()=>render());

</script>
